<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Instagram Image Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="" class="logo">
    <div>
      <h1>Instagram Image Saver</h1>
      <p class="subtitle">채널별 저장 현황</p>
    </div>
  </div>

  <div id="counter-list" class="counter-list">
    <p class="empty-msg">아직 저장한 이미지가 없습니다.<br>피드 게시물의 💾 버튼을 눌러 저장하세요.</p>
  </div>

  <div class="footer">
    <button id="reset-all-btn" class="btn-danger">전체 카운터 초기화</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
